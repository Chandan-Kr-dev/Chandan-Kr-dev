<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Chandan Kumar</title>
  <desc id="d">Animated title card: Chandan Kumar, Software Developer, Full-Stack, Game Developer. Developer by craft. Game creator by passion. Building ideas into reality.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.15" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepG" x1="0" x2="1">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363D" stroke-opacity="0.35"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
    .name { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .rise { opacity: 0; animation: rise 1.2s ease-out 0.5s forwards; }
    .fade { opacity: 0; animation: fade 1s ease-out 1.4s forwards; }
    .line { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.4s ease-out 1.1s forwards; }
    .tag { opacity: 0; animation: cycle 9s ease-in-out infinite; }
    .t1 { animation-delay: 2.4s; } .t2 { animation-delay: 5.4s; } .t3 { animation-delay: 8.4s; }
    .barT { transform-origin: 0 0; animation: bar 1.4s cubic-bezier(.7,0,.2,1) forwards; }
    .barB { transform-origin: 0 380px; animation: bar 1.4s cubic-bezier(.7,0,.2,1) forwards; }
    .cur { animation: blink 1s steps(1) infinite; }
    .sweep { animation: sweep 7s linear 2s infinite; }
    .ringA { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    .ringB { transform-box: fill-box; transform-origin: center; animation: spin 36s linear infinite reverse; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes cycle { 0% { opacity: 0; } 6% { opacity: 1; } 30% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes bar { from { transform: scaleY(5); } to { transform: scaleY(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#0D1117"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glowC)"/>
    <rect width="1200" height="380" fill="url(#glowV)"/>
    <rect class="sweep" x="0" y="0" width="240" height="380" fill="url(#sweepG)"/>

    <!-- decorative rings -->
    <g transform="translate(1015 190)">
      <circle class="ringA" r="96" fill="none" stroke="#00D9FF" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 12"/>
      <circle class="ringB" r="68" fill="none" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="40 14"/>
      <circle r="44" fill="#161B22" stroke="#30363D"/>
      <text class="fade" y="12" text-anchor="middle" font-size="34" fill="#00D9FF">&lt;/&gt;</text>
    </g>

    <!-- text -->
    <text class="fade" x="80" y="104" font-size="15" letter-spacing="3" fill="#00D9FF">&gt; hello, world<tspan class="cur">_</tspan></text>

    <text class="name rise" x="80" y="196" font-size="82" letter-spacing="3" fill="url(#g)">CHANDAN KUMAR</text>
    <line class="line" x1="82" y1="222" x2="640" y2="222" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

    <text class="fade" x="80" y="266" font-size="19" letter-spacing="2.5" fill="#E6EDF3">SOFTWARE DEVELOPER  ·  FULL-STACK  ·  GAME DEVELOPER</text>

    <text class="tag t1" x="80" y="318" font-size="23" fill="#8B949E"><tspan fill="#00D9FF">▸ </tspan>Developer by craft.</text>
    <text class="tag t2" x="80" y="318" font-size="23" fill="#8B949E"><tspan fill="#8B5CF6">▸ </tspan>Game creator by passion.</text>
    <text class="tag t3" x="80" y="318" font-size="23" fill="#8B949E"><tspan fill="#00D9FF">▸ </tspan>Building ideas into reality.</text>

    <!-- cinematic letterbox bars -->
    <rect class="barT" x="0" y="0" width="1200" height="30" fill="#05070A"/>
    <rect class="barB" x="0" y="350" width="1200" height="30" fill="#05070A"/>
    <rect x="0" y="30" width="1200" height="1" fill="#30363D"/>
    <rect x="0" y="349" width="1200" height="1" fill="#30363D"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

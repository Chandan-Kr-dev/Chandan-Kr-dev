<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Select Level — Featured Projects</title>
  <desc id="d">Arcade-style level select: The Last Room, MazeEscape, Kalpkant Games, plus prototypes Don't Let It See You and One Move.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363D" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
    .h { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .sel { opacity: 0; animation: pick 9s ease-in-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes pick { 0% { opacity: 0; } 5% { opacity: 1; } 31% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1200" height="570" rx="18" fill="#0D1117" stroke="#30363D"/>
  <rect width="1200" height="570" rx="18" fill="url(#grid)"/>

  <text x="60" y="68" font-size="15" letter-spacing="4" fill="#8B949E">FEATURED PROJECTS</text>
  <text class="h" x="60" y="108" font-size="34" fill="url(#g)" letter-spacing="2">SELECT LEVEL</text>
  <text x="1140" y="68" font-size="13" letter-spacing="2" text-anchor="end" fill="#8B949E">PLAYER 1  ·  CHANDAN</text>

  <!-- CARD 1 -->
  <g transform="translate(60 135)">
    <rect width="340" height="250" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect class="sel s1" width="340" height="250" rx="14" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <text x="24" y="34" font-size="12" letter-spacing="3" fill="#8B949E">LV 01</text>
    <g transform="translate(284 24)" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round">
      <circle cx="12" cy="12" r="11"/><path d="M21 21l14 14"/>
    </g>
    <text class="h" x="24" y="86" font-size="28" fill="#E6EDF3">The Last Room</text>
    <text x="24" y="112" font-size="13" fill="#00D9FF">Detective · Mystery</text>
    <text x="24" y="150" font-size="13" fill="#8B949E">Investigate the scene, question</text>
    <text x="24" y="170" font-size="13" fill="#8B949E">suspects, and accuse the culprit.</text>
    <line x1="24" y1="198" x2="316" y2="198" stroke="#30363D"/>
    <text x="24" y="226" font-size="13" letter-spacing="1" fill="#8B5CF6">UNITY  ·  C#  ·  GAME DEV</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(430 135)">
    <rect width="340" height="250" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect class="sel s2" width="340" height="250" rx="14" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <text x="24" y="34" font-size="12" letter-spacing="3" fill="#8B949E">LV 02</text>
    <g transform="translate(284 24)" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="square">
      <path d="M0 0h36v36H0z"/><path d="M12 0v24h12V12H12" />
      <path d="M0 24h6"/><path d="M30 36V18"/>
    </g>
    <text class="h" x="24" y="86" font-size="28" fill="#E6EDF3">MazeEscape</text>
    <text x="24" y="112" font-size="13" fill="#00D9FF">3D Maze · Casual</text>
    <text x="24" y="150" font-size="13" fill="#8B949E">Navigate 3D mazes, collect coins,</text>
    <text x="24" y="170" font-size="13" fill="#8B949E">and use hints when you're stuck.</text>
    <line x1="24" y1="198" x2="316" y2="198" stroke="#30363D"/>
    <text x="24" y="226" font-size="13" letter-spacing="1" fill="#8B5CF6">UNITY  ·  C#  ·  3D GAME DEV</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(800 135)">
    <rect width="340" height="250" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect class="sel s3" width="340" height="250" rx="14" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <text x="24" y="34" font-size="12" letter-spacing="3" fill="#8B949E">LV 03</text>
    <g transform="translate(272 26)" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round">
      <rect x="0" y="4" width="48" height="28" rx="10"/>
      <path d="M12 12v12M6 18h12"/>
      <circle cx="33" cy="15" r="2.5"/><circle cx="39" cy="22" r="2.5"/>
    </g>
    <text class="h" x="24" y="86" font-size="28" fill="#E6EDF3">Kalpkant Games</text>
    <text x="24" y="112" font-size="13" fill="#00D9FF">Indie Game Platform</text>
    <text x="24" y="150" font-size="13" fill="#8B949E">My indie brand and platform for</text>
    <text x="24" y="170" font-size="13" fill="#8B949E">showcasing games and ideas.</text>
    <line x1="24" y1="198" x2="316" y2="198" stroke="#30363D"/>
    <text x="24" y="226" font-size="13" letter-spacing="1" fill="#8B5CF6">WEB  ·  GAME DEV  ·  INDEPENDENT</text>
  </g>

  <!-- BONUS STAGES -->
  <text x="60" y="425" font-size="13" letter-spacing="4" fill="#8B949E">BONUS STAGES  ·  PROTOTYPES &amp; CONCEPTS</text>
  <g transform="translate(60 440)">
    <rect width="505" height="86" rx="12" fill="#161B22" stroke="#30363D" stroke-dasharray="6 6"/>
    <text class="h" x="22" y="32" font-size="19" fill="#E6EDF3">Don't Let It See You</text>
    <text x="22" y="54" font-size="12" fill="#8B949E">Horror / stealth prototype. The creature reacts to</text>
    <text x="22" y="71" font-size="12" fill="#8B949E">your visibility and movement.</text>
    <text x="483" y="32" font-size="11" letter-spacing="1" text-anchor="end" fill="#8B5CF6">UNITY · C#</text>
  </g>
  <g transform="translate(635 440)">
    <rect width="505" height="86" rx="12" fill="#161B22" stroke="#30363D" stroke-dasharray="6 6"/>
    <text class="h" x="22" y="32" font-size="19" fill="#E6EDF3">One Move</text>
    <text x="22" y="54" font-size="12" fill="#8B949E">Puzzle concept. Every level must be solved with a</text>
    <text x="22" y="71" font-size="12" fill="#8B949E">single move.</text>
    <text x="483" y="32" font-size="11" letter-spacing="1" text-anchor="end" fill="#8B5CF6">UNITY · C#</text>
  </g>

  <text class="blink" x="600" y="552" font-size="13" letter-spacing="6" text-anchor="middle" fill="#00D9FF">PRESS START</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

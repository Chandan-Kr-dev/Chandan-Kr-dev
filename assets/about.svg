<rect width="900" height="344" rx="14" fill="#0D1117"/><g transform="translate(24 20)"><text x="0" y="46" font-size="25" class="b" fill="#E6EDF3" letter-spacing="-.3">I build software and games,</text><text x="0" y="78" font-size="25" class="b" fill="url(#g)" letter-spacing="-.3">and I like knowing how they work.</text><text x="0" y="124" font-size="14.5" fill="#8B949E">Full-stack apps, backend systems, gameplay mechanics and</text><text x="0" y="148" font-size="14.5" fill="#8B949E">3D environments. I learn by building, breaking and fixing.</text><text x="0" y="190" font-size="14.5" fill="#8B949E">Right now I'm sharpening my engineering fundamentals and</text><text x="0" y="214" font-size="14.5" fill="#8B949E">shipping independent projects under Kalpkant Games.</text><text x="0" y="256" font-size="14.5" fill="#8B949E">The long-term goal is a game studio of my own, with original</text><text x="0" y="280" font-size="14.5" fill="#8B949E">games and technology worth building.</text><rect x="0" y="168" width="28" height="2" rx="1" fill="#00D9FF" opacity=".7"/><rect x="0" y="234" width="28" height="2" rx="1" fill="#8B5CF6" opacity=".7"/><rect x="480" y="6" width="372" height="292" rx="14" fill="#161B22" stroke="#30363D"/><rect x="480" y="6" width="372" height="292" rx="14" fill="url(#sheen)"/><rect x="480" y="6" width="372" height="40" rx="14" fill="#0D1117" opacity=".55"/><rect x="480" y="30" width="372" height="16" fill="#0D1117" opacity=".55"/><circle cx="504" cy="26" r="5" fill="#30363D"/><circle cx="522" cy="26" r="5" fill="#30363D"/><circle cx="540" cy="26" r="5" fill="#30363D"/><text class="m" x="836" y="30" font-size="12" fill="#8B949E" text-anchor="end">chandan.ts</text><text class="m" x="504" y="84" font-size="13.5"><tspan fill="#8B5CF6">const </tspan><tspan fill="#E6EDF3">chandan </tspan><tspan fill="#8B949E">= {</tspan></text><text class="m" x="526" y="114" font-size="13.5"><tspan fill="#E6EDF3">base: </tspan><tspan fill="#00D9FF">"India"</tspan><tspan fill="#8B949E">,</tspan></text><text class="m" x="526" y="144" font-size="13.5"><tspan fill="#E6EDF3">studio: </tspan><tspan fill="#00D9FF">"Kalpkant Games"</tspan><tspan fill="#8B949E">,</tspan></text><text class="m" x="526" y="174" font-size="13.5"><tspan fill="#E6EDF3">builds: </tspan><tspan fill="#8B949E">[</tspan><tspan fill="#00D9FF">"software"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#00D9FF">"games"</tspan><tspan fill="#8B949E">],</tspan></text><text class="m" x="526" y="204" font-size="13.5"><tspan fill="#E6EDF3">learns: </tspan><tspan fill="#00D9FF">"by building"</tspan><tspan fill="#8B949E">,</tspan></text><text class="m" x="526" y="234" font-size="13.5"><tspan fill="#E6EDF3">next: </tspan><tspan fill="#00D9FF">"a studio of my own"</tspan><tspan fill="#8B949E">,</tspan></text><text class="m" x="504" y="264" font-size="13.5"><tspan fill="#8B949E">};</tspan></text></g>

<title id="t">About Chandan Kumar</title><desc id="d">I build software and games, and I like knowing how they work. Full-stack apps, backend systems, gameplay mechanics and 3D environments. Currently sharpening engineering fundamentals and shipping independent projects under Kalpkant Games, with the goal of a game studio of my own.</desc>

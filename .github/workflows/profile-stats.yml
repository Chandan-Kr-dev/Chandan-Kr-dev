name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate statistics SVG
        env:
          GH_USERNAME: Chandan-Kr-dev
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard unchanged; skipping commit."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi

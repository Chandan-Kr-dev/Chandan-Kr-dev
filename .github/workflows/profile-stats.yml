name: Update profile stats

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh dashboard and contribution city
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        run: python scripts/generate_stats.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional. A classic personal access token (read:user) saved as the
          # PROFILE_TOKEN secret makes the graph count private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dashboard.svg assets/contribution-city.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
